<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="victoria.sh --whoami">
  <defs>
    <filter id="glowText" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowFrame" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff123c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff123c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff123c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipInner">
      <rect x="22" y="22" width="1156" height="256" rx="16"/>
    </clipPath>
  </defs>

  <style>
    <![CDATA[
      .bg { fill: #030304; }
      .mono { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
      .dim   { fill: #7a2230; }
      .mid   { fill: #ff4d63; }
      .bright{ fill: #ff123c; }
      .soft  { fill: #f4e7e9; }
      .cursor { fill: #ff123c; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      .scanbar { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(230px); }
        100% { transform: translateY(0px); }
      }
    ]]>
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="300"/>

  <!-- terminal frame -->
  <rect x="20" y="20" width="1160" height="260" rx="18" fill="#08080a" stroke="#ff123c" stroke-width="2" filter="url(#glowFrame)"/>

  <!-- scanline sweep, clipped to the frame interior -->
  <g clip-path="url(#clipInner)">
    <rect class="scanbar" x="22" y="22" width="1156" height="26" fill="url(#scan)"/>
  </g>

  <!-- title bar dots -->
  <circle cx="52" cy="50" r="6" fill="#5c0f18"/>
  <circle cx="74" cy="50" r="6" fill="#a3142a"/>
  <circle cx="96" cy="50" r="6" fill="#ff123c" filter="url(#glowFrame)"/>
  <line x1="20" y1="70" x2="1180" y2="70" stroke="#3a0d14" stroke-width="1.5"/>

  <!-- content -->
  <text class="mono dim" x="50" y="108" font-size="19">victoria@dev:~$ cat sobre-mi.txt</text>

  <text class="mono bright" x="48" y="178" font-size="56" font-weight="700" filter="url(#glowText)">Victoria De Winne</text>

  <text class="mono soft" x="50" y="217" font-size="22">Programadora Junior · Trainee en Desarrollo de Software</text>

  <text class="mono dim" x="50" y="258" font-size="19">victoria@dev:~$ <tspan class="cursor mono" fill="#ff123c">▌</tspan></text>
</svg>
