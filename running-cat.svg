<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" role="img" aria-label="gato neon corriendo">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    <![CDATA[
      .stage { fill: #060607; }
      .ground {
        stroke: #3a0d14;
        stroke-width: 2;
        stroke-dasharray: 14 14;
        animation: scroll 0.9s linear infinite;
      }
      @keyframes scroll {
        to { stroke-dashoffset: -56; }
      }

      .runner {
        animation: run-across 7s linear infinite;
      }
      @keyframes run-across {
        0%   { transform: translateX(-80px); }
        100% { transform: translateX(1280px); }
      }

      .bob { animation: bob 0.3s ease-in-out infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-5px); }
      }

      .stroke {
        fill: none;
        stroke: #ff123c;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fillshape {
        fill: #ff123c;
      }

      .leg { stroke-width: 4.5; }
      .leg-back  { animation: swing-back 0.3s ease-in-out infinite; }
      .leg-front { animation: swing-front 0.3s ease-in-out infinite; }
      @keyframes swing-back {
        0%, 100% { transform: rotate(24deg); }
        50%      { transform: rotate(-26deg); }
      }
      @keyframes swing-front {
        0%, 100% { transform: rotate(-26deg); }
        50%      { transform: rotate(24deg); }
      }
    ]]>
  </style>

  <rect class="stage" x="0" y="0" width="1200" height="160"/>
  <line class="ground" x1="0" y1="138" x2="1200" y2="138"/>

  <g class="runner">
    <g class="bob" transform="translate(0,110)" filter="url(#glow)">
      <!-- legs (drawn first so body overlaps their tops) -->
      <line class="stroke leg leg-back"  x1="-24" y1="0"  x2="-24" y2="26" style="transform-origin:-24px 0px"/>
      <line class="stroke leg leg-back"  x1="-13" y1="0"  x2="-13" y2="26" style="transform-origin:-13px 0px"/>
      <line class="stroke leg leg-front" x1="14"  y1="-6" x2="14"  y2="22" style="transform-origin:14px -6px"/>
      <line class="stroke leg leg-front" x1="24"  y1="-6" x2="24"  y2="22" style="transform-origin:24px -6px"/>

      <!-- tail -->
      <path class="stroke" d="M -33,2 C -50,-5 -55,-22 -44,-33"/>

      <!-- back / body silhouette -->
      <path class="stroke" d="M -34,4 C -30,-17 -6,-25 14,-17 C 20,-14 24,-10 27,-4"/>

      <!-- head -->
      <circle class="stroke" cx="34" cy="-15" r="12"/>

      <!-- ears -->
      <polygon class="fillshape" points="23,-24 20,-39 30,-27"/>
      <polygon class="fillshape" points="37,-26 42,-41 45,-27"/>
    </g>
  </g>
</svg>
